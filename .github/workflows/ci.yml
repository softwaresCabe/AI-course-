name: CI
on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: course
          POSTGRES_PASSWORD: course
          POSTGRES_DB: course_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U course" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      TEST_DATABASE_URL: postgres://course:course@localhost:5432/course_test
      E2E_DATABASE_URL: postgres://course:course@localhost:5432/course_e2e
      NEXT_TELEMETRY_DISABLED: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: PGPASSWORD=course psql -h localhost -U course -d course_test -c 'CREATE DATABASE course_e2e'
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - run: npm run build          # includes the paid-content bundle check
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - run: npm run build:artifact
